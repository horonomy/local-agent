[book]
title = "Local Agent Docs"
description = "Documentation for Local Agent, a local-first personal AI agent derived from ZeroClaw."
authors = ["Local Agent contributors"]
language = "en"
src = "src"

[output.html]
default-theme = "default-dark"
preferred-dark-theme = "default-dark"
git-repository-url = "https://github.com/horonomy/local-agent"
site-url = "/"
additional-js = [
  "theme/version-selector.js",
  "theme/lang-switcher.js",
  "theme/pc-enhance.js",
  "mermaid.min.js",
  "mermaid-init.js",
]
additional-css = ["theme/pc-themes.css", "theme/custom.css"]

[output.html.redirect]
"/contributing/multi-agent-setup.html" = "../agents/multi-agent-setup.html"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[output.html.print]
enable = false

[output.html.fold]
enable = true
level = 0

[preprocessor.gettext]
after = ["links"]

[preprocessor.peer-groups]
command = "../../target/release/mdbook preprocess"
before = ["links"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.placeholders]
command = "../../target/release/mdbook placeholders"
after = ["gettext", "mermaid"]
